[tox]
envlist = py39, py310, py311, py312, lint

[testenv:py{39,310,311,312}]
extras = cli
commands = python -m unittest -vb {posargs}

[testenv:lint]
deps = flake8==3.8.3
skip_install = true
commands = flake8 src

[flake8]
max-line-length = 99
# the original code, kept unchanged as the reference for the before/after comparison
exclude = tests/before_bug_fix
